<title>Stock Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky toolbar → KPI tiles → category chart → filter bar → inventory table; add/edit in a slide-over panel. */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --surface-2:#faf8f4; --surface-3:#f0ede6;
  --fg:#211e19; --fg-muted:#6c675d; --fg-faint:#948e82;
  --border:#e6e2d9; --border-strong:#d6d1c5;
  --accent:#9c7318; --accent-fg:#ffffff; --accent-soft:#f4ead3;
  --good:#2f8f5b; --good-soft:#e3f1e8;
  --warn:#b67d10; --warn-soft:#f7ecd2;
  --crit:#bf4330; --crit-soft:#f7e2dc;
  --shadow:0 1px 2px rgba(30,25,15,.04),0 6px 20px rgba(30,25,15,.06);
  --radius:14px;
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161513; --surface:#201e1a; --surface-2:#1b1a16; --surface-3:#26241f;
  --fg:#f0ede6; --fg-muted:#a8a194; --fg-faint:#7d776c;
  --border:#302d27; --border-strong:#3c3831;
  --accent:#d9a43c; --accent-fg:#1b1710; --accent-soft:#39301d;
  --good:#53b985; --good-soft:#1c2c23;
  --warn:#e0a63a; --warn-soft:#2e2715;
  --crit:#e37259; --crit-soft:#2e1d18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161513; --surface:#201e1a; --surface-2:#1b1a16; --surface-3:#26241f;
  --fg:#f0ede6; --fg-muted:#a8a194; --fg-faint:#7d776c;
  --border:#302d27; --border-strong:#3c3831;
  --accent:#d9a43c; --accent-fg:#1b1710; --accent-soft:#39301d;
  --good:#53b985; --good-soft:#1c2c23;
  --warn:#e0a63a; --warn-soft:#2e2715;
  --crit:#e37259; --crit-soft:#2e1d18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);margin:0;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Sora",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.wrap{max-width:1180px;margin:0 auto;padding-left:16px;padding-right:16px;padding-block:0 48px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#000));display:grid;place-items:center;color:var(--accent-fg);flex:none;box-shadow:var(--shadow)}
.brand .mark svg{width:19px;height:19px}
.brand h1{font-size:17px;font-weight:700;line-height:1.1}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--fg-muted);letter-spacing:.02em}
.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:transform .05s,background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.icon-btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:17px;height:17px}

/* kpi */
.section-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-faint);margin:26px 2px 11px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.kpi .k-top{display:flex;align-items:center;gap:7px;color:var(--fg-muted);font-size:12px;font-weight:600}
.kpi .k-top svg{width:15px;height:15px;opacity:.8}
.kpi .k-val{font-family:"Sora",sans-serif;font-weight:700;font-size:25px;margin-top:9px;letter-spacing:-.02em;line-height:1}
.kpi .k-sub{font-size:11.5px;color:var(--fg-faint);margin-top:6px}
.kpi.alert .k-val{color:var(--crit)}
.kpi.alert.none .k-val{color:var(--good)}

/* chart card */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.cat-card{padding:18px 20px}
.cat-card h2{font-size:14.5px;font-weight:600;margin-bottom:3px}
.cat-sub{font-size:12px;color:var(--fg-muted);margin-bottom:16px}
.bars{display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:14px}
.bar-name{font-size:13px;font-weight:600;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:12px;background:var(--surface-3);border-radius:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,#fff2cc),var(--accent));min-width:4px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar-val{font-size:12.5px;font-weight:600;color:var(--fg-muted);min-width:118px;text-align:right}

/* filter bar */
.toolrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 2px 14px}
.search{flex:1;min-width:180px;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--fg-faint)}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);border-radius:10px;font-size:14px;font-family:inherit}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--border-strong);background:var(--surface);color:var(--fg-muted);padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
:root[data-theme="dark"] .chip.active,:root:not([data-theme="light"]) .chip.active{color:var(--accent)}

/* table */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:720px}
thead th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-faint);padding:13px 14px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
thead th.no-sort{cursor:default}
thead th .sort-ind{opacity:.5;font-size:10px}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.prod-cell{display:flex;align-items:center;gap:11px;min-width:0}
.thumb{width:40px;height:40px;border-radius:9px;flex:none;object-fit:cover;background:var(--surface-3);border:1px solid var(--border)}
.thumb.ph{display:grid;place-items:center;color:var(--fg-faint)}
.thumb.ph svg{width:18px;height:18px}
.prod-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.prod-sku{font-size:11px;color:var(--fg-faint);margin-top:1px}
.cat-tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--fg-muted);background:var(--surface-3);padding:3px 9px;border-radius:7px;text-transform:capitalize;white-space:nowrap}
.qty-edit{display:inline-flex;align-items:center;gap:0;border:1px solid var(--border-strong);border-radius:9px;overflow:hidden}
.qty-edit button{width:28px;height:30px;border:none;background:var(--surface-2);color:var(--fg);font-size:16px;line-height:1;display:grid;place-items:center}
.qty-edit button:hover{background:var(--surface-3)}
.qty-edit input{width:46px;height:30px;border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);background:var(--surface);color:var(--fg);text-align:center;font-size:13.5px;font-weight:600;font-family:inherit}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.in{color:var(--good);background:var(--good-soft)}
.status.low{color:var(--warn);background:var(--warn-soft)}
.status.out{color:var(--crit);background:var(--crit-soft)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.row-actions button{width:30px;height:30px;border:1px solid transparent;background:transparent;color:var(--fg-faint);border-radius:8px;display:grid;place-items:center}
.row-actions button:hover{background:var(--surface-3);color:var(--fg)}
.row-actions button.del:hover{color:var(--crit);background:var(--crit-soft)}
.row-actions svg{width:15px;height:15px}
.right{text-align:right}

/* empty / loading */
.state{padding:56px 24px;text-align:center;color:var(--fg-muted)}
.state svg{width:40px;height:40px;color:var(--fg-faint);margin-bottom:12px}
.state h3{font-size:16px;color:var(--fg);margin-bottom:6px}
.state p{font-size:13.5px;max-width:330px;margin:0 auto 16px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.bar-fill{transition:none}}

/* slide-over panel */
.scrim{position:fixed;inset:0;background:rgba(20,16,8,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:51;box-shadow:-8px 0 40px rgba(20,16,8,.2);transform:translateX(100%);transition:transform .25s cubic-bezier(.3,.7,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet.open{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.sheet-head h2{font-size:17px;font-weight:700}
.sheet-body{padding:20px;overflow-y:auto;flex:1}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--fg);border-radius:10px;font-size:14px;font-family:inherit}
.field textarea{resize:vertical;min-height:62px}
.field .hint{font-size:11.5px;color:var(--fg-faint);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calc-line{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--border)}
.calc-line span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.photo-drop{border:1.5px dashed var(--border-strong);border-radius:12px;padding:16px;text-align:center;color:var(--fg-muted);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.photo-drop:hover{border-color:var(--accent);background:var(--surface-2)}
.photo-drop svg{width:22px;height:22px;color:var(--fg-faint)}
.photo-btns{display:flex;gap:10px}
.photo-b{flex:1;justify-content:center}
.photo-prev{position:relative;width:88px;height:88px;border-radius:12px;overflow:hidden;border:1px solid var(--border);margin:0 auto}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-prev button{position:absolute;top:4px;right:4px;width:24px;height:24px;border:none;border-radius:7px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.photo-prev button svg{width:13px;height:13px}
.sheet-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-foot .btn{flex:1;justify-content:center}
.err-msg{background:var(--crit-soft);color:var(--crit);font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:9px;margin-bottom:14px}

/* confirm mini-dialog */
.confirm{position:absolute;right:8px;top:calc(100% - 2px);z-index:5;background:var(--surface);border:1px solid var(--border-strong);border-radius:11px;box-shadow:var(--shadow);padding:12px;width:210px;text-align:left}
.confirm p{font-size:12.5px;margin:0 0 10px;color:var(--fg)}
.confirm .row{display:flex;gap:8px}
.confirm .row button{flex:1;padding:7px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--fg)}
.confirm .row button.yes{background:var(--crit);border-color:var(--crit);color:#fff}

.ro-note{font-size:12px;color:var(--fg-muted);background:var(--surface-3);padding:8px 12px;border-radius:9px;display:inline-flex;gap:7px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;z-index:80;opacity:0;transition:.25s;box-shadow:var(--shadow);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:860px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi.span{grid-column:span 2}
  .bar-row{grid-template-columns:110px 1fr auto}
  .bar-name{font-size:12px}
  .bar-val{min-width:96px;font-size:11.5px}
}
@media (max-width:480px){
  .bar-val{min-width:0}
  .bar-row{grid-template-columns:96px 1fr;grid-template-rows:auto auto}
  .bar-val{grid-column:2;text-align:left;margin-top:-6px}
}
</style>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 13h6"/></svg></div>
      <div><h1>Stock Room</h1><p>Inventory tracker</p></div>
    </div>
    <button class="btn" id="importBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>Import</button>
    <button class="btn" id="exportBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5M12 3v12"/></svg>Export</button>
    <input id="importFile" type="file" accept=".xlsx,.xls,.csv" hidden>
    <button class="icon-btn" id="themeBtn" title="Switch theme" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="btn btn-primary" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add product</button>
  </div>
</header>

<main class="wrap">
  <div class="section-label">Overview</div>
  <div class="kpis" id="kpis"></div>

  <div class="section-label">Stock by category</div>
  <div class="panel cat-card">
    <h2>Units &amp; value per category</h2>
    <div class="cat-sub">Bars show units in stock. Value shown at right.</div>
    <div class="bars" id="bars"></div>
  </div>

  <div class="section-label">Products</div>
  <div class="toolrow">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Search name or SKU…" autocomplete="off"></div>
    <div class="chips" id="catChips"></div>
  </div>
  <div class="table-wrap" id="tableWrap"></div>
</main>

<!-- slide-over -->
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-head"><h2 id="sheetTitle">Add product</h2>
    <button class="icon-btn" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="sheet-body">
    <div id="formErr" class="err-msg" hidden></div>
    <div class="field" id="photoField">
      <label>Product photo</label>
      <div id="photoPrev" class="photo-prev" hidden><img id="photoImg" alt=""><button type="button" id="photoRemove" aria-label="Remove photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
      <div id="photoBtns" class="photo-btns">
        <button type="button" class="btn photo-b" id="camBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Camera</button>
        <button type="button" class="btn photo-b" id="uploadBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg>Upload</button>
      </div>
      <input id="photoInput" type="file" accept="image/*" hidden>
      <input id="camInput" type="file" accept="image/*" capture="environment" hidden>
    </div>
    <div class="field"><label for="fName">Product name</label><input id="fName" type="text" placeholder="e.g. Gold wheat clutcher"></div>
    <div class="field"><label for="fSku">SKU / code</label><input id="fSku" type="text" class="mono" placeholder="e.g. WHEAT-CLUTCH-G"><div class="hint">Your own code. Leave blank to auto-make from the name.</div></div>
    <div class="field"><label for="fCat">Category</label><input id="fCat" type="text" list="catList" placeholder="e.g. metal clip"><datalist id="catList"></datalist></div>
    <div class="grid2">
      <div class="field"><label for="fQty">Quantity</label><input id="fQty" type="number" min="0" step="1" placeholder="0"></div>
      <div class="field"><label for="fCost">Cost price ₹</label><input id="fCost" type="number" min="0" step="1" placeholder="0"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="fPrice">Selling price ₹</label><input id="fPrice" type="number" min="0" step="1" placeholder="0"></div>
      <div class="field"><label for="fLow">Low-stock at ≤</label><input id="fLow" type="number" min="0" step="1" placeholder="5"></div>
    </div>
    <div class="field"><label for="fNotes">Notes</label><textarea id="fNotes" placeholder="Optional"></textarea></div>
    <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:12px 14px">
      <div class="calc-line"><span>Stock value</span><span id="calcStock">₹0</span></div>
      <div class="calc-line"><span>Potential sales</span><span id="calcSales">₹0</span></div>
      <div class="calc-line" style="border:none"><span>Margin / unit</span><span id="calcMargin">₹0</span></div>
    </div>
  </div>
  <div class="sheet-foot">
    <button class="btn" id="sheetCancel">Cancel</button>
    <button class="btn btn-primary" id="sheetSave" style="flex:1.4">Save product</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  "use strict";
  var LOW_DEFAULT=5;
  var db=null,user=null,assets=null,downloads=null,canWrite=false,dbReady=false;
  var products=[],loaded=false;
  var ui={q:"",cat:"all",sortKey:"name",sortDir:"asc"};
  var editingId=null,pendingPhoto=null; // pendingPhoto: {id} after upload, or null

  var $=function(s){return document.querySelector(s)};
  var el=function(id){return document.getElementById(id)};
  function inr(n){n=Math.round(Number(n)||0);return "₹"+n.toLocaleString("en-IN")}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function slug(s){return String(s||"").trim().toUpperCase().replace(/[^A-Z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||("ITEM-"+Date.now().toString(36).toUpperCase())}

  /* ---------- theme ---------- */
  function initTheme(){
    var saved=null;try{saved=localStorage.getItem("sr-theme")}catch(e){}
    if(saved)document.documentElement.setAttribute("data-theme",saved);
    el("themeBtn").addEventListener("click",function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var sysDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;
      var next=cur?(cur==="dark"?"light":"dark"):(sysDark?"light":"dark");
      document.documentElement.setAttribute("data-theme",next);
      try{localStorage.setItem("sr-theme",next)}catch(e){}
    });
  }

  /* ---------- derived ---------- */
  function statusOf(p){var low=(p.low==null?LOW_DEFAULT:p.low);var q=Number(p.quantity)||0;if(q<=0)return"out";if(q<=low)return"low";return"in"}
  function totals(){
    var t={count:products.length,units:0,stockVal:0,sales:0,low:0,out:0};
    products.forEach(function(p){var q=Number(p.quantity)||0;t.units+=q;t.stockVal+=q*(Number(p.cost)||0);t.sales+=q*(Number(p.price)||0);var s=statusOf(p);if(s==="low")t.low++;if(s==="out")t.out++;});
    return t;
  }

  /* ---------- render ---------- */
  function render(){renderKpis();renderBars();renderChips();renderTable();}

  function renderKpis(){
    var t=totals();var alertN=t.low+t.out;
    var tiles=[
      {ic:'<path d="M20 7L12 3 4 7v10l8 4 8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/>',lab:"Products",val:t.count.toLocaleString("en-IN"),sub:"active SKUs"},
      {ic:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/>',lab:"Units in stock",val:t.units.toLocaleString("en-IN"),sub:"total pieces"},
      {ic:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9a2.5 2.5 0 0 0-2.5-2h-1a2 2 0 0 0 0 4h1a2 2 0 0 1 0 4h-1A2.5 2.5 0 0 1 9.5 15"/><path d="M12 6v1.5M12 16v1.5"/>',lab:"Stock value",val:inr(t.stockVal),sub:"at cost price"},
      {ic:'<path d="M3 17l6-6 4 4 7-7"/><path d="M17 8h4v4"/>',lab:"Potential sales",val:inr(t.sales),sub:"at selling price"},
      {ic:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',lab:"Needs attention",val:alertN.toLocaleString("en-IN"),sub:t.out+" out · "+t.low+" low",alert:true,none:alertN===0}
    ];
    el("kpis").innerHTML=tiles.map(function(k){
      return '<div class="kpi'+(k.alert?" alert span":"")+(k.none?" none":"")+'"><div class="k-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+k.ic+'</svg>'+k.lab+'</div><div class="k-val num">'+k.val+'</div><div class="k-sub">'+k.sub+'</div></div>';
    }).join("");
  }

  function renderBars(){
    var map={};
    products.forEach(function(p){var c=(p.category||"uncategorized").trim()||"uncategorized";if(!map[c])map[c]={units:0,val:0};var q=Number(p.quantity)||0;map[c].units+=q;map[c].val+=q*(Number(p.cost)||0);});
    var rows=Object.keys(map).map(function(c){return{name:c,units:map[c].units,val:map[c].val}});
    rows.sort(function(a,b){return b.units-a.units});
    var max=rows.reduce(function(m,r){return Math.max(m,r.units)},0)||1;
    if(!rows.length){el("bars").innerHTML='<div style="color:var(--fg-faint);font-size:13px">No categories yet.</div>';return;}
    el("bars").innerHTML=rows.map(function(r){
      return '<div class="bar-row"><div class="bar-name" title="'+esc(r.name)+'">'+esc(r.name)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(r.units/max*100)+'%"></div></div><div class="bar-val num">'+r.units.toLocaleString("en-IN")+' u · '+inr(r.val)+'</div></div>';
    }).join("");
  }

  function renderChips(){
    var cats={};products.forEach(function(p){var c=(p.category||"").trim();if(c)cats[c]=(cats[c]||0)+1});
    var list=["all"].concat(Object.keys(cats).sort());
    el("catChips").innerHTML=list.map(function(c){
      var lab=c==="all"?"All":c;
      return '<button class="chip'+(ui.cat===c?" active":"")+'" data-cat="'+esc(c)+'">'+esc(lab.charAt(0).toUpperCase()+lab.slice(1))+(c!=="all"?' <span class="num" style="opacity:.6">'+cats[c]+'</span>':'')+'</button>';
    }).join("");
    // datalist for form
    el("catList").innerHTML=Object.keys(cats).sort().map(function(c){return '<option value="'+esc(c)+'">'}).join("");
  }

  function filteredSorted(){
    var q=ui.q.toLowerCase();
    var rows=products.filter(function(p){
      if(ui.cat!=="all" && (p.category||"").trim()!==ui.cat)return false;
      if(q){var hay=((p.name||"")+" "+(p.sku||"")+" "+(p.category||"")).toLowerCase();if(hay.indexOf(q)<0)return false;}
      return true;
    });
    var k=ui.sortKey,dir=ui.sortDir==="asc"?1:-1;
    rows.sort(function(a,b){
      var av,bv;
      if(k==="name"){av=(a.name||"").toLowerCase();bv=(b.name||"").toLowerCase();return av<bv?-dir:av>bv?dir:0}
      if(k==="category"){av=(a.category||"").toLowerCase();bv=(b.category||"").toLowerCase();return av<bv?-dir:av>bv?dir:0}
      if(k==="status"){var ord={out:0,low:1,"in":2};return (ord[statusOf(a)]-ord[statusOf(b)])*dir}
      if(k==="value"){av=(Number(a.quantity)||0)*(Number(a.cost)||0);bv=(Number(b.quantity)||0)*(Number(b.cost)||0);return(av-bv)*dir}
      av=Number(a[k])||0;bv=Number(b[k])||0;return(av-bv)*dir;
    });
    return rows;
  }

  function renderTable(){
    var wrap=el("tableWrap");
    if(!loaded){
      wrap.innerHTML='<div style="padding:16px">'+Array(5).join('<div class="skel" style="margin:12px 0;width:'+(60+Math.random()*30)+'%"></div>')+'</div>';
      return;
    }
    if(!products.length){
      wrap.innerHTML='<div class="state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 7L12 3 4 7v10l8 4 8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg><h3>No products yet</h3><p>Add your first product to start tracking stock, value and low-stock alerts.</p>'+(canWrite?'<button class="btn btn-primary" onclick="document.getElementById(\'addBtn\').click()">Add product</button>':'')+'</div>';
      return;
    }
    var rows=filteredSorted();
    if(!rows.length){wrap.innerHTML='<div class="state"><h3>No matches</h3><p>Nothing matches your search or filter.</p></div>';return;}
    function hd(key,label,cls){var ind=ui.sortKey===key?(ui.sortDir==="asc"?" ↑":" ↓"):"";return '<th class="'+(cls||"")+'" data-sort="'+key+'">'+label+'<span class="sort-ind">'+ind+'</span></th>'}
    var head='<thead><tr>'+hd("name","Product")+hd("category","Category")+hd("quantity","Qty","right")+hd("value","Stock value","right")+hd("price","Sell ₹","right")+hd("status","Status")+'<th class="no-sort right">'+(canWrite?"Actions":"")+'</th></tr></thead>';
    var body=rows.map(function(p){
      var q=Number(p.quantity)||0,st=statusOf(p);
      var stLab={"in":"In stock",low:"Low",out:"Out"}[st];
      var thumb=p.imageId?'<img class="thumb" src="/_blob/'+esc(p.imageId)+'" alt="">':'<div class="thumb ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15l-5-5L5 21"/><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/></svg></div>';
      var qtyCell=canWrite
        ? '<div class="qty-edit" data-id="'+esc(p.id)+'"><button class="qd" aria-label="Decrease">−</button><input class="qi num" type="text" inputmode="numeric" value="'+q+'"><button class="qu" aria-label="Increase">+</button></div>'
        : '<span class="num">'+q+'</span>';
      var actions=canWrite?'<div class="row-actions"><button class="ed" data-id="'+esc(p.id)+'" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button><button class="del" data-id="'+esc(p.id)+'" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button></div>':'';
      return '<tr><td><div class="prod-cell">'+thumb+'<div style="min-width:0"><div class="prod-name" title="'+esc(p.name)+'">'+esc(p.name||"Untitled")+'</div><div class="prod-sku mono">'+esc(p.sku||"")+'</div></div></div></td>'+
        '<td><span class="cat-tag">'+esc(p.category||"—")+'</span></td>'+
        '<td class="right">'+qtyCell+'</td>'+
        '<td class="right num">'+inr(q*(Number(p.cost)||0))+'</td>'+
        '<td class="right num">'+inr(p.price)+'</td>'+
        '<td><span class="status '+st+'">'+stLab+'</span></td>'+
        '<td class="right" style="position:relative">'+actions+'</td></tr>';
    }).join("");
    wrap.innerHTML='<table>'+head+'<tbody>'+body+'</tbody></table>';
  }

  /* ---------- events (delegated) ---------- */
  function wireEvents(){
    el("search").addEventListener("input",function(e){ui.q=e.target.value;renderTable()});
    el("catChips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;ui.cat=b.getAttribute("data-cat");renderChips();renderTable()});
    el("tableWrap").addEventListener("click",function(e){
      var th=e.target.closest("th[data-sort]");
      if(th){var k=th.getAttribute("data-sort");if(ui.sortKey===k)ui.sortDir=ui.sortDir==="asc"?"desc":"asc";else{ui.sortKey=k;ui.sortDir=(k==="name"||k==="category")?"asc":"desc"}renderTable();return;}
      var ed=e.target.closest(".ed");if(ed){openSheet(ed.getAttribute("data-id"));return;}
      var del=e.target.closest(".del");if(del){askDelete(del);return;}
      var qd=e.target.closest(".qd");if(qd){stepQty(qd.closest(".qty-edit").getAttribute("data-id"),-1);return;}
      var qu=e.target.closest(".qu");if(qu){stepQty(qu.closest(".qty-edit").getAttribute("data-id"),1);return;}
    });
    el("tableWrap").addEventListener("change",function(e){
      var qi=e.target.closest(".qi");if(qi){var id=qi.closest(".qty-edit").getAttribute("data-id");var v=Math.max(0,Math.round(Number(qi.value)||0));setQty(id,v);}
    });
    el("addBtn").addEventListener("click",function(){openSheet(null)});
    el("sheetClose").addEventListener("click",closeSheet);
    el("sheetCancel").addEventListener("click",closeSheet);
    el("scrim").addEventListener("click",closeSheet);
    el("sheetSave").addEventListener("click",saveProduct);
    ["fQty","fCost","fPrice"].forEach(function(id){el(id).addEventListener("input",updateCalc)});
    // photo
    el("camBtn").addEventListener("click",function(){el("camInput").click()});
    el("uploadBtn").addEventListener("click",function(){el("photoInput").click()});
    el("photoInput").addEventListener("change",handlePhoto);
    el("camInput").addEventListener("change",handlePhoto);
    el("photoRemove").addEventListener("click",function(){pendingPhoto=null;el("photoPrev").hidden=true;el("photoBtns").hidden=false;el("photoInput").value="";el("camInput").value=""});
    el("exportBtn").addEventListener("click",exportXlsx);
    el("importBtn").addEventListener("click",function(){el("importFile").click()});
    el("importFile").addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];if(f)importFile(f);e.target.value="";});
    document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});
  }

  function stepQty(id,d){var p=byId(id);if(!p)return;setQty(id,Math.max(0,(Number(p.quantity)||0)+d))}
  function byId(id){for(var i=0;i<products.length;i++)if(products[i].id===id)return products[i];return null}

  function setQty(id,v){
    var p=byId(id);if(!p)return;p.quantity=v;render(); // optimistic
    if(!db||!canWrite)return;
    db.doc("products/"+id).update({quantity:v,updatedAt:Date.now()}).catch(function(err){handleWriteErr(err)});
  }

  /* ---------- delete with inline confirm ---------- */
  function askDelete(btn){
    var id=btn.getAttribute("data-id");
    var cell=btn.closest("td");
    var ex=cell.querySelector(".confirm");if(ex){ex.remove();return;}
    document.querySelectorAll(".confirm").forEach(function(c){c.remove()});
    var box=document.createElement("div");box.className="confirm";
    box.innerHTML='<p>Delete this product?</p><div class="row"><button class="no">Cancel</button><button class="yes">Delete</button></div>';
    cell.appendChild(box);
    box.querySelector(".no").addEventListener("click",function(){box.remove()});
    box.querySelector(".yes").addEventListener("click",function(){doDelete(id);box.remove()});
  }
  function doDelete(id){
    products=products.filter(function(p){return p.id!==id});render();
    if(!db||!canWrite)return;
    db.doc("products/"+id).delete().then(function(){toast("Product deleted")}).catch(function(err){handleWriteErr(err)});
  }

  /* ---------- sheet (add/edit) ---------- */
  function openSheet(id){
    if(!canWrite){toast("Read-only — only the owner can edit");return;}
    editingId=id;pendingPhoto=null;el("formErr").hidden=true;
    var p=id?byId(id):null;
    el("sheetTitle").textContent=id?"Edit product":"Add product";
    el("sheetSave").textContent=id?"Save changes":"Save product";
    el("fName").value=p?p.name||"":"";
    el("fSku").value=p?p.sku||"":"";
    el("fCat").value=p?p.category||"":"";
    el("fQty").value=p&&p.quantity!=null?p.quantity:"";
    el("fCost").value=p&&p.cost!=null?p.cost:"";
    el("fPrice").value=p&&p.price!=null?p.price:"";
    el("fLow").value=p&&p.low!=null?p.low:"";
    el("fNotes").value=p?p.notes||"":"";
    if(p&&p.imageId){pendingPhoto={id:p.imageId};el("photoImg").src="/_blob/"+p.imageId;el("photoPrev").hidden=false;el("photoBtns").hidden=true;}
    else{el("photoPrev").hidden=true;el("photoBtns").hidden=false;}
    el("photoField").style.display=assets?"":"none";
    updateCalc();
    el("scrim").classList.add("open");el("sheet").classList.add("open");el("sheet").setAttribute("aria-hidden","false");
    setTimeout(function(){el("fName").focus()},260);
  }
  function closeSheet(){el("scrim").classList.remove("open");el("sheet").classList.remove("open");el("sheet").setAttribute("aria-hidden","true");}
  function updateCalc(){
    var q=Number(el("fQty").value)||0,c=Number(el("fCost").value)||0,pr=Number(el("fPrice").value)||0;
    el("calcStock").textContent=inr(q*c);el("calcSales").textContent=inr(q*pr);el("calcMargin").textContent=inr(pr-c);
  }
  function handlePhoto(e){
    var f=e.target.files&&e.target.files[0];if(!f){return;}
    if(!assets){toast("Photos unavailable in this view");return;}
    var url=URL.createObjectURL(f);el("photoImg").src=url;el("photoPrev").hidden=false;el("photoBtns").hidden=true;
    el("photoImg").dataset.pending="1";pendingPhoto={file:f};
    e.target.value="";
  }

  function saveProduct(){
    if(!canWrite)return;
    var name=el("fName").value.trim();
    if(!name){showFormErr("Please enter a product name.");return;}
    var sku=el("fSku").value.trim()||slug(name);
    var data={
      name:name,sku:sku,
      category:el("fCat").value.trim()||"uncategorized",
      quantity:Math.max(0,Math.round(Number(el("fQty").value)||0)),
      cost:Math.max(0,Number(el("fCost").value)||0),
      price:Math.max(0,Number(el("fPrice").value)||0),
      low:el("fLow").value===""?LOW_DEFAULT:Math.max(0,Math.round(Number(el("fLow").value)||0)),
      notes:el("fNotes").value.trim(),
      updatedAt:Date.now()
    };
    var id=editingId||("p-"+slug(sku).toLowerCase()+"-"+Date.now().toString(36));
    el("sheetSave").disabled=true;el("sheetSave").textContent="Saving…";
    var chain=Promise.resolve();
    if(pendingPhoto&&pendingPhoto.file&&assets){
      chain=assets.upload(pendingPhoto.file).then(function(r){data.imageId=r.id}).catch(function(){/* keep going without photo */});
    } else if(pendingPhoto&&pendingPhoto.id){ data.imageId=pendingPhoto.id; }
    chain.then(function(){
      if(!editingId)data.createdAt=Date.now();
      // optimistic local
      var existing=byId(id);
      if(existing){Object.keys(data).forEach(function(k){existing[k]=data[k]})}
      else{products.push(Object.assign({id:id},data))}
      render();
      if(db&&canWrite){
        return db.doc("products/"+id).set(editingId?Object.assign({createdAt:(byId(id)&&byId(id).createdAt)||Date.now()},data):data);
      }
    }).then(function(){
      el("sheetSave").disabled=false;closeSheet();toast(editingId?"Changes saved":"Product added");
    }).catch(function(err){
      el("sheetSave").disabled=false;el("sheetSave").textContent=editingId?"Save changes":"Save product";
      handleWriteErr(err);showFormErr("Could not save. "+(err&&err.code==="invalid_argument"?"You may not have edit access.":"Please try again."));
    });
  }
  function showFormErr(m){var e=el("formErr");e.textContent=m;e.hidden=false}

  function handleWriteErr(err){
    if(err&&(err.code==="invalid_argument")){canWrite=false;render();toast("View is read-only")}
    else{toast("Save failed — check connection")}
  }

  var toastT;
  function toast(m){var t=el("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show")},2200)}

  /* ---------- export / import (Excel) ---------- */
  function exportXlsx(){
    if(typeof XLSX==="undefined"){toast("Export library still loading…");return;}
    if(!products.length){toast("Nothing to export yet");return;}
    var rows=products.map(function(p){var q=Number(p.quantity)||0;var st={"in":"In stock",low:"Low",out:"Out"}[statusOf(p)];
      return {"Product":p.name||"","SKU":p.sku||"","Category":p.category||"","Quantity":q,
        "Cost Price":Number(p.cost)||0,"Selling Price":Number(p.price)||0,"Low Stock At":(p.low==null?LOW_DEFAULT:p.low),
        "Stock Value":q*(Number(p.cost)||0),"Potential Sales":q*(Number(p.price)||0),"Status":st,
        "Has Photo":p.imageId?"Yes":"No","Notes":p.notes||""};});
    var ws=XLSX.utils.json_to_sheet(rows);
    ws["!cols"]=[{wch:26},{wch:22},{wch:16},{wch:9},{wch:11},{wch:13},{wch:12},{wch:12},{wch:15},{wch:10},{wch:10},{wch:24}];
    var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Inventory");
    var buf;try{buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});}catch(e){toast("Could not build file");return;}
    if(!downloads){toast("Download not available in this view");return;}
    var name="Stock Room "+new Date().toISOString().slice(0,10)+".xlsx";
    downloads.save({filename:name,data:buf}).then(function(){toast("Excel exported")}).catch(function(err){if(err&&err.code==="declined")return;toast("Export failed")});
  }
  function pick(o,keys){for(var i=0;i<keys.length;i++){var k=keys[i];if(o[k]!==undefined&&o[k]!=="")return o[k];}return "";}
  function toNum(v){if(v===""||v==null)return 0;var n=Number(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n;}
  function importFile(file){
    if(typeof XLSX==="undefined"){toast("Import library still loading…");return;}
    if(!db||!canWrite){toast("Read-only — cannot import here");return;}
    var rd=new FileReader();
    rd.onload=function(ev){
      var rows;
      try{var wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});var ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:""});}
      catch(e){toast("Could not read file — use .xlsx or .csv");return;}
      if(!rows||!rows.length){toast("No rows found in file");return;}
      var bySku={};products.forEach(function(p){if(p.sku)bySku[String(p.sku).toLowerCase()]=p;});
      var added=0,updated=0,chain=Promise.resolve(),errs=0;
      rows.forEach(function(r){
        var name=String(pick(r,["Product","Name","name","product","PRODUCT"])||"").trim();
        var sku=String(pick(r,["SKU","Sku","sku","Code","code"])||"").trim();
        if(!name&&!sku)return;
        var cat=String(pick(r,["Category","category","CATEGORY"])||"uncategorized").trim()||"uncategorized";
        var qty=Math.max(0,Math.round(toNum(pick(r,["Quantity","Qty","quantity","qty","QTY"]))));
        var cost=Math.max(0,toNum(pick(r,["Cost Price","Cost","cost","cost price"])));
        var price=Math.max(0,toNum(pick(r,["Selling Price","Sell","price","selling price","Price","MRP"])));
        var lowRaw=pick(r,["Low Stock At","Low","low","Low Stock"]);var low=(lowRaw===""||lowRaw==null)?LOW_DEFAULT:Math.max(0,Math.round(toNum(lowRaw)));
        var notes=String(pick(r,["Notes","notes","Note"])||"");
        var existing=sku?bySku[sku.toLowerCase()]:null;
        var data={name:name,sku:sku||slug(name),category:cat,quantity:qty,cost:cost,price:price,low:low,notes:notes,updatedAt:Date.now()};
        var id;
        if(existing){id=existing.id;if(existing.imageId)data.imageId=existing.imageId;data.createdAt=existing.createdAt||Date.now();updated++;}
        else{id="p-"+slug(data.sku).toLowerCase()+"-"+Date.now().toString(36)+Math.floor(Math.random()*1000);data.createdAt=Date.now();added++;}
        chain=chain.then(function(){return db.doc("products/"+id).set(data);}).catch(function(){errs++;});
      });
      chain.then(function(){toast("Imported: "+added+" new, "+updated+" updated"+(errs?(" · "+errs+" failed"):""));});
    };
    rd.onerror=function(){toast("Could not open file")};
    rd.readAsArrayBuffer(file);
  }

  /* ---------- boot ---------- */
  initTheme();wireEvents();renderKpis();renderBars();renderTable();

  function startFallback(){ // if db never resolves, show empty editable-less state after timeout handled by use() null
  }

  (async function(){
    try{ db=(window.claude&&claude.use)?await claude.use("db"):null; }catch(e){db=null}
    try{ user=(window.claude&&claude.use)?await claude.use("user"):null; }catch(e){user=null}
    try{ assets=(window.claude&&claude.use)?await claude.use("assets"):null; }catch(e){assets=null}
    try{ downloads=(window.claude&&claude.use)?await claude.use("downloads"):null; }catch(e){downloads=null}
    if(user){
      try{var w=user.can?user.can("data.write"):null;var own=user.isOwner?user.isOwner():false;canWrite=(w===null||w===undefined)?!!own:(!!w||!!own);}catch(e){canWrite=true}
    } else { canWrite=true; } // owner-only tool; default allow, writes will confirm
    if(!db){
      loaded=true;dbReady=false;
      el("tableWrap").innerHTML='<div class="state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/></svg><h3>Storage unavailable here</h3><p>Open this page while signed in to load and save your inventory. Your data is kept with the artifact.</p></div>';
      return;
    }
    dbReady=true;
    db.collection("products").onSnapshot(function(snap){
      products=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o;});
      loaded=true;render();
    },function(err){
      loaded=true;
      el("tableWrap").innerHTML='<div class="state"><h3>Could not load inventory</h3><p>'+esc(err&&err.message||"Please reload the page.")+'</p></div>';
    });
  })();
})();
</script>
